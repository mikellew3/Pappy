name = "pappy-sync"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# KV namespace holding the single picks document.
# Create it once with:  wrangler kv namespace create PAPPY_KV
# then paste the returned id below (and a preview_id for `wrangler dev`).
[[kv_namespaces]]
binding = "PAPPY_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
# preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

# SYNC_SECRET is NOT set here — it's a secret. Set it with:
#   wrangler secret put SYNC_SECRET
